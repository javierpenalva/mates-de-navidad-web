<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1d3a">
<title>Mates de Navidad</title>
<!--
  MATES DE NAVIDAD v2 - juego de cálculo mental con números enteros (1º-2º ESO)
  Archivo único: HTML + CSS + JS, sin librerías ni recursos externos. Funciona sin internet.

  MODO DE PRUEBAS: solo con ?test=1 existe window.__JUEGO__ y se aceptan ?seed=N (semilla) y
  ?rapido=1 (Contrarreloj de 20 s, tiempos x0,25). Sin ?test=1 todo eso se ignora (aula).

  DECISIONES DE DISEÑO (documentadas; el detalle está en CHANGELOG.md):
    - Prima la corrección sobre la rapidez: bonus de tiempo <= +10 % del base (nunca rompe el tope),
      racha x1,1 cada 3 aciertos con tope x1,3, error = -5·d puntos.
    - Contrarreloj: 5:00 REALES (reloj monótono). El reloj no se detiene al acertar; solo se detiene
      mientras se lee la explicación de un error. Error: -10 s (animado). «No sé»: -3 s.
      Clasificación de Contrarreloj por (aciertos - 2·errores); se muestran aciertos y errores.
    - El rey de las mates: 20 preguntas respondidas (incluidas reencoladas y en blanco).
    - Pausa: oculta la pregunta pero NO detiene ningún reloj (no regala tiempo de reflexión).
      Salir: pide confirmación y la partida abandonada NO se guarda.
    - Corona solo si la puntuación supera a la mejor de TODA la clasificación y a la mejor propia.
    - Salto máximo de dificultad: +-1 nivel entre preguntas consecutivas.
    - PIN de profesorado guardado como huella (hash) con bloqueo progresivo (3 fallos = 30 s, luego se duplica).
    - CSV con separador ";" y BOM UTF-8 (Excel en español); «Copiar resumen» usa tabuladores.
    - Categorías numeradas 1..4 en la API: 1 suma/resta, 2 mult./división, 3 potencias, 4 combinadas.
-->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --noche:#0b1d3a;--noche2:#1b3a6b;--rojo:#d62839;--verde:#157a45;--verde-s:#0d4f2c;--oro:#ffc83d;
  --tinta:#12263f;--papel:#f8fbff;--azul:#2d6cdf;--suave:#5a6e8a;
  --tecla:clamp(56px,8.4vh,84px);
}
@supports (height:1dvh){:root{--tecla:clamp(56px,8.4dvh,84px)}}
html,body{margin:0;height:100%;overflow:hidden;background:var(--noche);color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{background:linear-gradient(180deg,#07142b 0%,#12306a 60%,#1d4a86 100%) fixed}
#nieve{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:0}
#app{position:fixed;top:0;left:0;right:0;bottom:0;height:100%;z-index:1;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
@supports (height:1dvh){#app{height:100dvh}}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
/* foco visible: selectores SEPARADOS (Safari < 15.4 descarta toda la regla si no entiende :focus-visible) */
button:focus-visible{outline:4px solid var(--oro);outline-offset:3px}
input:focus-visible{outline:4px solid var(--oro);outline-offset:2px}
textarea:focus-visible{outline:4px solid var(--oro);outline-offset:2px}
#modal-caja button:focus-visible{outline:4px solid #12263f;outline-offset:2px}
#modal-caja textarea:focus-visible{outline:4px solid #12263f;outline-offset:2px}
.tecla:focus-visible{outline:4px solid var(--oro);outline-offset:3px}
input,textarea{font-size:16px;-webkit-user-select:text;user-select:text}
sup{font-size:.55em;line-height:0;position:relative;top:-.85em;vertical-align:baseline;margin-left:1px}
[hidden]{display:none!important}

/* barra superior */
#barra{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 14px;min-height:56px}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;padding:6px 8px;font-size:22px;font-weight:800;
  color:#fff;letter-spacing:.2px;min-height:44px;white-space:nowrap;flex:0 1 auto;min-width:0}
.logo span{text-shadow:0 2px 0 rgba(0,0,0,.35)}
#chip-alumno{margin-left:auto;background:rgba(255,255,255,.16);border-radius:999px;padding:8px 16px;font-weight:700;font-size:18px;white-space:nowrap;flex:0 0 auto}
.btn-barra{flex:0 0 auto;min-height:56px;min-width:56px;padding:0 16px;border-radius:14px;border:0;background:rgba(255,255,255,.2);font-weight:800;font-size:18px;color:#fff;white-space:nowrap}
#btn-pausa{margin-left:auto}
#btn-sonido{margin-left:auto;flex:0 0 auto;width:56px;height:56px;border-radius:50%;border:0;background:rgba(255,255,255,.18);font-size:28px}
#chip-alumno:not([hidden])+#btn-sonido,#btn-salir:not([hidden])+#btn-sonido,#btn-pausa:not([hidden])+#btn-salir+#btn-sonido{margin-left:0}
#btn-pausa:not([hidden])~#chip-alumno{margin-left:0}

/* pantallas */
#pantallas{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.pantalla{display:none;flex:1;min-height:0;flex-direction:column;padding:6px 16px 14px;position:relative}
.pantalla.activa{display:flex}
.pantalla.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
h1,h2,h3{margin:0}
.titulo{font-size:clamp(30px,5.4vmin,56px);font-weight:900;text-align:center;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.sub{font-size:clamp(18px,2.6vmin,26px);text-align:center;opacity:.95;margin:4px 0 0}

/* botones */
.btn{min-height:56px;padding:12px 22px;border-radius:16px;border:0;font-weight:800;font-size:20px;
  background:#fff;color:var(--tinta);box-shadow:0 4px 0 #9fb3cc}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9fb3cc}
.btn.rojo{background:var(--rojo);color:#fff;box-shadow:0 4px 0 #8c1722}
.btn.verde{background:var(--verde);color:#fff;box-shadow:0 4px 0 var(--verde-s)}
.btn.oro{background:var(--oro);color:#3a2a00;box-shadow:0 4px 0 #b88a0c}
.btn.suave{background:rgba(255,255,255,.18);color:#fff;box-shadow:none}
.btn.pequeno{min-height:56px;font-size:18px;padding:10px 16px}

/* teclado propio */
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tecla{height:var(--tecla);font-size:calc(var(--tecla)*.46);font-weight:800;border-radius:16px;border:0;
  background:#fff;color:var(--tinta);box-shadow:0 4px 0 #9fb3cc;min-width:44px;padding:0}
.tecla:active{transform:translateY(3px);box-shadow:0 1px 0 #9fb3cc;background:#e8f0fb}
.tecla.acc{background:#ffe3a3;box-shadow:0 4px 0 #c79a2a}
.tecla.ok{background:var(--verde);color:#fff;box-shadow:0 4px 0 var(--verde-s);grid-column:span 2;font-size:calc(var(--tecla)*.36)}
.tecla.nose{background:rgba(255,255,255,.88);font-size:calc(var(--tecla)*.30);color:#2f4766}
.tecla.vacia{visibility:hidden}
.tecla.entrar{grid-column:span 3;background:var(--verde);color:#fff;box-shadow:0 4px 0 var(--verde-s);font-size:calc(var(--tecla)*.38)}

/* pantalla número de lista (con scroll de seguridad en pantallas bajas) */
#p-lista{align-items:center}
.lista-grid{display:grid;gap:14px 40px;width:100%;max-width:1000px;align-items:center;margin:auto 0}
.lista-izq{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:0;justify-content:center}
.lista-der{display:flex;flex-direction:column;gap:12px;align-items:stretch;max-width:420px;width:100%;margin:0 auto}
.escena{display:flex;align-items:flex-end;justify-content:center;gap:6px;font-size:clamp(34px,6vmin,64px);line-height:1;min-height:0}
.escena svg{height:clamp(120px,24vmin,260px);width:auto}
.visor{background:#fff;color:var(--tinta);border-radius:18px;min-height:80px;display:flex;align-items:center;justify-content:center;
  font-size:56px;font-weight:900;letter-spacing:2px;border:4px solid var(--oro)}
.visor.vacio{color:var(--suave);font-size:30px;font-weight:700;letter-spacing:0}
.msg{min-height:28px;text-align:center;font-size:20px;font-weight:700;color:#ffd0d4}
.sacudir{animation:sacudir .35s}
@keyframes sacudir{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (orientation:landscape) and (min-width:700px){.lista-grid{grid-template-columns:1fr 1fr}}

/* menú */
#p-menu{align-items:center;gap:12px}
.modos{display:grid;gap:16px;width:100%;max-width:1000px;flex:1 0 auto;min-height:0;align-content:center}
@media (orientation:landscape) and (min-width:700px){.modos{grid-template-columns:1fr 1fr}}
.modo{background:linear-gradient(160deg,#fff 0%,#e6f0ff 100%);color:var(--tinta);border:0;border-radius:24px;padding:18px 20px;
  text-align:center;box-shadow:0 6px 0 #8fa6c6;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:150px;justify-content:center}
.modo:active{transform:translateY(4px);box-shadow:0 2px 0 #8fa6c6}
.modo .ic{font-size:clamp(40px,7vmin,64px);line-height:1}
.modo h3{font-size:clamp(24px,3.6vmin,34px);font-weight:900}
.modo p{margin:0;font-size:clamp(16px,2.3vmin,21px);line-height:1.25}
.fila-botones{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;width:100%;max-width:1000px}
.fila-botones .btn{width:100%}

/* juego */
#p-juego{padding:4px 14px 12px;gap:8px}
.hud{display:grid;grid-template-columns:1fr 1fr 1.7fr 1fr;gap:8px;position:relative;z-index:25}
.celda{background:rgba(255,255,255,.14);border-radius:14px;padding:6px 10px;min-height:56px;display:flex;flex-direction:column;justify-content:center;min-width:0;position:relative}
.celda small{font-size:13px;opacity:.95;text-transform:uppercase;letter-spacing:.5px}
.celda b{font-size:clamp(22px,3.4vmin,32px);font-weight:900;white-space:nowrap}
.celda.reloj{background:rgba(255,255,255,.2);align-items:center;text-align:center}
.celda.reloj b{font-variant-numeric:tabular-nums;font-size:clamp(34px,6.4vmin,60px);line-height:1.05}
.celda.reloj.urge{background:#8c1722}
.celda.reloj.urge b{color:#fff}
.celda.reloj.golpe{animation:golpe .7s}
@keyframes golpe{0%{background:#d62839;transform:scale(1.07)}100%{transform:scale(1)}}
.pen-anim{position:absolute;right:8px;top:-6px;font-size:clamp(20px,3.4vmin,30px);font-weight:900;color:#ffb3bb;text-shadow:0 2px 0 rgba(0,0,0,.5);opacity:0;pointer-events:none}
.pen-anim.ver{animation:resta 1.4s ease-out}
@keyframes resta{0%{opacity:0;transform:translateY(0)}12%{opacity:1}100%{opacity:0;transform:translateY(16px)}}
.barranivel{height:10px;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:4px}
.barranivel i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7be39a,#ffd23f);transition:width .4s}
.barra-global{height:8px;border-radius:5px;background:rgba(255,255,255,.2);overflow:hidden;flex:0 0 auto}
.barra-global i{display:block;height:100%;width:100%;background:#7be39a;transform-origin:left;transform:scaleX(1)}
.barra-global i.medio{background:#ffd23f}.barra-global i.poco{background:#ff6b78}
.cuerpo{flex:1;min-height:0;display:grid;gap:10px;position:relative;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"card" "deco" "keys"}
.tarjeta{grid-area:card}.deco{grid-area:deco}.teclado-juego{grid-area:keys}
@media (orientation:landscape) and (min-width:700px){
  .cuerpo{grid-template-columns:minmax(0,1fr) clamp(320px,32vw,460px);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"card deco" "card keys"}
  .tarjeta{justify-content:center}
}
.tarjeta{background:var(--papel);color:var(--tinta);border-radius:22px;padding:10px 16px 12px;box-shadow:0 6px 0 rgba(0,0,0,.25);
  display:flex;flex-direction:column;align-items:center;gap:6px;min-height:0;min-width:0}
.tarjeta .cat{font-size:16px;font-weight:800;color:#a8281c;text-transform:uppercase;letter-spacing:.6px}
#expr{font-size:clamp(48px,7.2vmin,78px);font-weight:900;white-space:nowrap;overflow:hidden;max-width:100%;text-align:center;line-height:1.25;width:100%;
  font-variant-numeric:tabular-nums}
#resp{min-width:200px;border:4px solid var(--oro);border-radius:16px;background:#fff;font-size:clamp(40px,6vmin,60px);font-weight:900;padding:2px 24px;min-height:70px;
  display:flex;align-items:center;justify-content:center;gap:10px}
#resp.vacia{color:var(--suave)}
#resp.ok{border-color:#157a45;background:#e3f7ea}
.fila-extra{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px;font-size:15px;font-weight:700;color:#3d526e}
.bonus{display:flex;align-items:center;gap:6px;white-space:nowrap;flex:0 0 auto}
.estrellas{letter-spacing:2px;font-size:18px;color:#c9d3e3}
.estrellas b{color:#c78a00;font-weight:400}
#toast{color:#0d6b3a;font-weight:900;font-size:18px;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto}
#toast.aviso{color:#a61e2d}
#toast.ver{animation:toast 1.4s}
@keyframes toast{0%{opacity:0;transform:translateY(6px)}12%{opacity:1;transform:translateY(0)}85%{opacity:1}100%{opacity:0}}
.deco{min-height:0;display:flex;align-items:center;justify-content:center;gap:16px;overflow:hidden}
.deco svg{height:100%;max-height:100%;width:auto;min-height:0}
.regalos{display:flex;flex-wrap:wrap;gap:2px;max-width:240px;font-size:30px;align-content:center;justify-content:center}
.regalos small{width:100%;text-align:center;font-size:16px;font-weight:700}
.bola{fill:#35506e;stroke:#1d2f45;stroke-width:1.5;transition:fill .25s}
.bola.on{fill:var(--c);stroke:#fff;stroke-width:2.5}
.bola.rota{animation:romper .55s}
@keyframes romper{0%{fill:#fff;stroke:#ff3b4d;stroke-width:7;opacity:.3}100%{stroke-width:1.5;opacity:1}}
.estrella{fill:#6a5a2a;transition:fill .3s}
.estrella.on{fill:#ffd23f}
.teclado-juego{display:flex;flex-direction:column;justify-content:flex-end}
#fb-error{position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(5,15,35,.8);display:flex;align-items:center;justify-content:center;z-index:20;padding:12px;overflow-y:auto}
#fb-error .caja{background:#fff;color:var(--tinta);border-radius:24px;padding:18px 22px;max-width:680px;width:100%;max-height:100%;overflow-y:auto;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.3);margin:auto}
#fb-error h3{font-size:26px;margin-bottom:4px}
#fb-error .cuenta{font-size:clamp(32px,6vmin,52px);font-weight:900;margin:2px 0}
#fb-error p{margin:5px 0;font-size:18px;line-height:1.3}
#fb-error .pen{color:#a61e2d;font-weight:800}
#fbe-expl{text-align:left;font-size:18px;line-height:1.35;background:#eef4fc;border-radius:14px;padding:8px 12px;margin:6px 0}
#fbe-expl .pasos div{padding:2px 0}
#fbe-expl .regla{margin-top:5px;font-weight:700;color:#12263f}
#fbe-expl .animo{margin-top:5px;font-size:16px;color:#3d526e}

/* resultados / clasificación */
.res-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:6px 28px;max-width:1040px;width:100%;margin:0 auto}
@media (orientation:landscape) and (min-width:700px){.res-layout{grid-template-columns:1.1fr 1fr;align-items:center;margin:auto}}
.res-cab{text-align:center}
.medalla{font-size:clamp(56px,10vmin,96px);line-height:1}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:760px;width:100%;margin:8px auto}
.dato{background:rgba(255,255,255,.95);color:var(--tinta);border-radius:16px;padding:8px;text-align:center}
.dato b{display:block;font-size:clamp(26px,4.4vmin,40px);font-weight:900}
.dato span{font-size:15px;font-weight:700;color:#3d526e}
.dato.grande{grid-column:1/-1;background:#fff3c4}
.res-niv{max-width:760px;width:100%;margin:4px auto;display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:16px}
.res-niv .fn{display:flex;flex-direction:column;gap:2px}
.res-niv .fn div{display:flex;justify-content:space-between;font-weight:700}
.res-codigo{text-align:center;font-size:18px;margin:6px 0}
.res-codigo code{display:inline-block;background:#fff;color:var(--tinta);border-radius:10px;padding:6px 14px;font-size:22px;font-weight:900;
  -webkit-user-select:text;user-select:text;font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:4px;word-break:break-all}
.res-botones{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:760px;width:100%;margin:8px auto 0}
.res-botones .btn{width:100%}
.res-botones .grande{grid-column:1/-1}
.res-pos{text-align:center;font-size:20px;font-weight:800;color:#ffe8a0}
.res-aviso{text-align:center;font-size:17px;min-height:22px;color:#ffe8a0}
.regalos-fin{text-align:center;font-size:28px;line-height:1.2;max-width:760px;margin:2px auto;word-break:break-all}
.tabs{display:flex;gap:8px;justify-content:center;margin:6px 0;flex-wrap:wrap}
.tab{min-height:56px;padding:8px 18px;border-radius:14px;border:0;background:rgba(255,255,255,.18);font-weight:800;font-size:18px;color:#fff}
.tab.sel{background:var(--oro);color:#3a2a00}
table.tabla{border-collapse:separate;border-spacing:0;width:100%;max-width:760px;margin:6px auto;background:rgba(255,255,255,.96);color:var(--tinta);border-radius:14px;font-size:18px}
table.tabla th,table.tabla td{padding:8px 10px;text-align:center;border-bottom:1px solid #dbe5f3}
table.tabla th{background:#dbe7fa;font-size:15px}
table.tabla tr.yo td{background:#fff3c4;font-weight:900}
table.tabla tr.sep td{background:#eef3fb;color:#3d526e;font-size:15px;padding:2px}
.empate{font-size:13px;color:#3d526e;font-weight:700}

/* modal */
#modal{position:fixed;left:0;top:0;right:0;bottom:0;z-index:50;background:rgba(3,10,25,.78);display:flex;align-items:center;justify-content:center;padding:14px;
  padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(14px,env(safe-area-inset-bottom))}
#modal.opaco{background:#07142b}
#modal-caja{background:#fff;color:var(--tinta);border-radius:24px;padding:20px 22px;max-width:760px;width:100%;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  box-shadow:0 10px 0 rgba(0,0,0,.3);display:flex;flex-direction:column;gap:10px;--tecla:clamp(52px,7vh,68px)}
@supports (height:1dvh){#modal-caja{--tecla:clamp(52px,7dvh,68px)}}
#modal-caja.ancho{max-width:980px;min-height:60%}
#modal-caja .tecla{background:#e6eefb;box-shadow:0 4px 0 #9fb3cc}
#modal-caja .tecla.acc{background:#ffe3a3;box-shadow:0 4px 0 #c79a2a}
#modal-caja .tecla.entrar{background:var(--verde);color:#fff;box-shadow:0 4px 0 var(--verde-s)}
#modal-caja h2{font-size:28px}
#modal-caja p,#modal-caja li{font-size:18px;line-height:1.35;margin:4px 0}
#modal-caja .btn{box-shadow:0 4px 0 #9fb3cc;background:#e6eefb}
#modal-caja .btn.verde{background:var(--verde);color:#fff;box-shadow:0 4px 0 var(--verde-s)}
#modal-caja .btn.rojo{background:var(--rojo);color:#fff;box-shadow:0 4px 0 #8c1722}
#modal-caja .tab{background:#e6eefb;color:var(--tinta)}
#modal-caja .tab.sel{background:var(--oro);color:#3a2a00}
#modal-caja table.tabla{background:#fff;max-width:none;font-size:16px}
#modal-caja table.tabla th{position:sticky;top:0;z-index:2}
#modal-caja .visor{min-height:64px;font-size:44px}
.modal-botones{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap}
.aviso-ok{color:#0d6b3a;font-weight:800;min-height:24px}
.aviso-mal{color:#a61e2d;font-weight:800}
textarea.csv{width:100%;min-height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;border:2px solid #9fb3cc;border-radius:12px;padding:8px;color:var(--tinta)}
.modelo h3{font-size:20px;margin:12px 0 2px}
.modelo code{background:#eef3fb;border-radius:6px;padding:1px 6px;-webkit-user-select:text;user-select:text}
.modelo details{margin:8px 0}.modelo summary{font-weight:800;font-size:18px;min-height:44px;cursor:pointer;display:flex;align-items:center}
.pin-puntos{letter-spacing:10px}
.reloj-pausa{font-size:56px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums}
.seccion{border-top:2px solid #dbe5f3;padding-top:8px;margin-top:6px}
.seccion h3{font-size:19px;margin:2px 0 4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- móvil y pantallas pequeñas ---- */
@media (max-width:600px){
  .logo{font-size:18px}.logo .logo-t{display:none}
  .btn-barra{padding:0 10px;font-size:16px;min-height:48px}
  #btn-sonido{width:48px;height:48px;font-size:24px}
  .hud{grid-template-columns:1fr 1fr 1.5fr 1fr;gap:5px}

  .res-botones{grid-template-columns:1fr}
  #fbe-expl,#fb-error p{font-size:16px}
}
@media (max-width:400px){body.en-juego #chip-alumno{display:none}}

<body>
<canvas id="nieve" aria-hidden="true"></canvas>
<div id="app">
  <header id="barra">
    <button id="logo" class="logo" type="button" aria-label="Mates de Navidad"><span aria-hidden="true">🎄</span><span class="logo-t">Mates de Navidad</span></button>
    <button id="btn-pausa" class="btn-barra" type="button" hidden>⏸ Pausa</button>
    <button id="btn-salir" class="btn-barra" type="button" hidden>✖ Salir</button>
    <div id="chip-alumno" hidden></div>
    <button id="btn-sonido" type="button" aria-label="Silenciar sonido" aria-pressed="false">🔊</button>
  </header>
  <main id="pantallas">

    <!-- 1. NÚMERO DE LISTA -->
    <section id="p-lista" class="pantalla scroll" aria-label="Identificación">
      <div class="lista-grid">
        <div class="lista-izq">
          <h1 class="titulo">¡Feliz Navidad!</h1>
          <p class="sub">Escribe tu <b>número de lista</b> (del 1 al 40)</p>
          <div class="escena" id="escena-lista" aria-hidden="true"></div>
        </div>
        <div class="lista-der">
          <div class="visor vacio" id="visor-lista" role="status" aria-live="polite">Tu número</div>
          <div class="msg" id="msg-lista" role="status"></div>
          <div id="tec-lista"></div>
        </div>
      </div>
    </section>

    <!-- 2. MENÚ -->
    <section id="p-menu" class="pantalla scroll" aria-label="Menú">
      <h1 class="titulo" id="saludo">¡Hola!</h1>
      <p class="sub">Elige cómo quieres jugar</p>
      <div class="modos">
        <button class="modo" id="btn-cr" type="button">
          <span class="ic" aria-hidden="true">⏱️</span><h3>Contrarreloj</h3>
          <p>5 minutos reales. Más aciertos, mejor; cada error te quita 10 segundos.</p>
        </button>
        <button class="modo" id="btn-rm" type="button">
          <span class="ic" aria-hidden="true">👑</span><h3>El rey de las mates</h3>
          <p>20 preguntas sin reloj. Gana quien consiga más puntos: ¡cuenta acertar!</p>
        </button>
      </div>
      <div class="fila-botones">
        <button class="btn oro" id="btn-rank" type="button">🏆 Clasificación</button>
        <button class="btn" id="btn-ayuda" type="button">❓ Cómo se juega</button>
        <button class="btn suave" id="btn-cambiar" type="button">🔁 Cambiar alumno</button>
      </div>
      <div class="escena" aria-hidden="true" style="margin-top:10px">🎅 🦌 🎁 ⛄ 🧝 🔔</div>
    </section>

    <!-- 3. JUEGO -->
    <section id="p-juego" class="pantalla" aria-label="Partida">
      <div class="hud" id="hud">
        <div class="celda"><small>Puntos</small><b id="h-puntos">0</b></div>
        <div class="celda"><small>Racha</small><b id="h-racha">0</b></div>
        <div class="celda reloj" id="h-modo-celda"><small id="h-modo-t">Tiempo</small><b id="h-modo">5:00</b><span class="pen-anim" id="h-pen" aria-hidden="true"></span></div>
        <div class="celda"><small>Nivel</small><b id="h-niv-t">1 de 10</b><div class="barranivel" aria-hidden="true"><i id="h-niv"></i></div></div>
      </div>
      <div class="barra-global" id="barra-global" aria-hidden="true"><i id="bg-i"></i></div>
      <div class="cuerpo">
        <div class="tarjeta" id="tarjeta">
          <div class="cat" id="q-cat">Suma y resta</div>
          <div id="expr" aria-live="polite"></div>
          <div id="resp" class="vacia" role="status" aria-label="Tu respuesta">= ?</div>
          <div class="fila-extra"><span class="bonus" title="Bonus por responder rápido"><span class="estrellas" id="estrellas" aria-hidden="true">★★★</span><span id="bonus-t">Rápido: hasta +10 %</span></span><span id="toast" role="status"></span></div>
        </div>
        <div class="deco" id="deco" aria-hidden="true"></div>
        <div class="teclado-juego"><div id="tec-juego"></div></div>
      </div>
      <div id="fb-error" hidden>
        <div class="caja" role="alertdialog" aria-labelledby="fbe-t" aria-describedby="fbe-cuenta">
          <h3 id="fbe-t">¡Casi!</h3>
          <div class="cuenta" id="fbe-cuenta"></div>
          <p id="fbe-tu"></p>
          <div id="fbe-expl"></div>
          <p class="pen" id="fbe-pen"></p>
          <button class="btn verde" id="fbe-ok" type="button">Continuar</button>
        </div>
      </div>
    </section>

    <!-- 4. RESULTADOS -->
    <section id="p-result" class="pantalla scroll" aria-label="Resultados"></section>

    <!-- 5. CLASIFICACIÓN -->
    <section id="p-rank" class="pantalla scroll" aria-label="Clasificación">
      <h1 class="titulo">🏆 Clasificación</h1>
      <div class="tabs" id="rank-tabs">
        <button class="tab sel" type="button" data-modo="CR">⏱️ Contrarreloj</button>
        <button class="tab" type="button" data-modo="RM">👑 El rey de las mates</button>
      </div>
      <div id="rank-tabla"></div>
      <div class="fila-botones" style="margin-top:8px;max-width:360px"><button class="btn oro" id="rank-volver" type="button">⬅ Volver</button></div>
    </section>
  </main>
</div>

<div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-titulo"><div id="modal-caja"></div></div>

<script>
'use strict';
(function () {
  var G = (typeof window !== 'undefined') ? window : globalThis;

  /* ===================================================================
   *  CONFIGURACIÓN
   * =================================================================== */
  // PIN del panel de profesorado. Se guarda solo su HUELLA (hash), no el PIN.

  var LISTA_MAX = 40;

  var TEST = params ? params.get('test') === '1' : true;
  var RAPIDO = TEST && !!(params && params.get('rapido') === '1');
  var CFG = {
    DURACION_CR: RAPIDO ? 20 : 300,    // segundos de Contrarreloj (reales)
    PENAL_CR: 10,                      // segundos que resta cada error en Contrarreloj
    PENAL_NOSE_CR: 3,                  // segundos que resta «No sé» en Contrarreloj
    PREGUNTAS_RM: 20,                  // el rey de las mates: 20 preguntas
    FACTOR_TIEMPO: RAPIDO ? 0.25 : 1,  // escala del tiempo objetivo
    PAUSA_OK: RAPIDO ? 60 : 220,       // ms de comentario tras un acierto (la entrada NO se bloquea)
    PAUSA_ERR: RAPIDO ? 250 : 0,       // 0 = esperar al botón Continuar
    COLA_RETRASO: 3,                   // preguntas hasta reencolar un error
    LUCES: 12,
    MAXLEN_VISUAL: 22,                 // longitud visual máxima de la expresión
    BONUS_MAX: 0.10,                   // bonus de tiempo: hasta +10 % del base
    RACHA_PASO: 0.1,                   // +0,1 por cada 3 aciertos seguidos
    RACHA_TOPE: 1.3,                   // multiplicador máximo de racha
    PENAL_PUNTOS: 7,                   // puntos que resta un error: PENAL_PUNTOS x nivel (calibrado con tests/puntuacion_sim.cjs)
    ERR_PESO_RANK: 2,                  // Contrarreloj: puntuación = aciertos - ERR_PESO_RANK x errores
    FUGA_CAT: 0.25,                    // peso con que la evidencia de una categoría actualiza las demás
    BLOQUEO_TOQUE: RAPIDO ? 60 : 350                 // ms sin aceptar toques fantasma tras Continuar / Jugar otra vez...
  };
  var NOMBRES_CAT = ['Suma y resta', 'Multiplicación y división', 'Potencias', 'Operaciones combinadas'];
  var M = '−'; // signo menos tipográfico
  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }

  /* ===================================================================
   *  HASH simple (FNV-1a 32 bits) para el PIN y los códigos
   * =================================================================== */
  function hash32(s) {
    var h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }

  function hashPin(pin) { return hex8(hash32('mn1|' + pin)) + hex8(hash32(String(pin).split('').reverse().join('') + '|navidad')); }
  var ALFA32 = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
  function b32(n, len) { var s = ''; for (var i = 0; i < len; i++) { s = ALFA32.charAt(n & 31) + s; n = n >>> 5; } return s; }

  /* ===================================================================
   *  ALEATORIO CON SEMILLA (mulberry32). Un único generador para toda la
   *  lógica del juego; lo cosmético (nieve, mensajes) usa Math.random.
   * =================================================================== */
  var RNG = {
    s: 1, semilla: 1,
    sembrar: function (n) { this.semilla = n >>> 0; this.s = (n | 0) || 1; },
    next: function () {

      var t = Math.imul(a ^ (a >>> 15), 1 | a);

      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    },
    ri: function (a, b) { return a + Math.floor(this.next() * (b - a + 1)); },
    pick: function (arr) { return arr[Math.floor(this.next() * arr.length)]; },
    chance: function (p) { return this.next() < p; },
    sg: function () { return this.next() < 0.5 ? -1 : 1; }

  (function () {
    var s = (TEST && params) ? params.get('seed') : null;

   *  EVALUADOR: analizador sintáctico descendente propio (SIN eval).

    }

      try {
        var tk = tokenizar(expr), p = 0, maxAbs = 0;
        var reg = function (v) {

          var v = termino();
          while (esOp('+-')) { var o = tk[p++].v, r = termino(); v = reg(o === '+' ? v + r : v - r); }

        };

          var v = unario();
          while (esOp('*/')) {

            else { if (r === 0) throw new Error('división por 0'); if (v % r !== 0) throw new Error('división no exacta'); v = reg(v / r); }

        };

          if (esOp('+-')) { var o = tk[p++].v; var r = unario(); return reg(o === '-' ? -r : r); }

        };

          var b = atomo();
          if (esOp('^')) {
            p++;

        };

          if (t.t === 'n') { p++; return reg(t.v); }

            p++; var v = expr_(); var c = tk[p++];

          }
          throw new Error('símbolo inesperado');
        };

        if (p !== tk.length) throw new Error('sobran símbolos');
        if (val === 0) val = 0; // evita -0
        return { ok: true, valor: val, max: maxAbs };
      } catch (e) { return { ok: false, valor: NaN, max: NaN, error: String(e.message) }; }
    }
    function evaluar(expr) { return detallado(expr).valor; }

    /* ---- árbol: n (número), u (signo), g (grupo), p (potencia), s (suma/resta), m (producto/cociente) ---- */
    function parsear(src) {
      var tk = tokenizar(src), p = 0;
      var esOp = function (c) { var t = tk[p]; return t && t.t === 'o' && c.indexOf(t.v) >= 0; };
      var expr_ = function () {
        var it = [termino()], op = [];
        while (esOp('+-')) { op.push(tk[p++].v); it.push(termino()); }
        return it.length === 1 ? it[0] : { k: 's', t: it, o: op };
      };
      var termino = function () {
        var it = [unario()], op = [];
        while (esOp('*/')) { op.push(tk[p++].v); it.push(unario()); }
        return it.length === 1 ? it[0] : { k: 'm', t: it, o: op };
      };
      var unario = function () {
        if (esOp('+-')) { var s = tk[p++].v; return { k: 'u', s: s, x: unario() }; }
        return potencia();
      };
      var potencia = function () {
        var b = atomo();
        if (esOp('^')) { p++; var e = esOp('+-') ? unario() : potencia(); return { k: 'p', b: b, e: e }; }
        return b;
      };
      var atomo = function () {
        var t = tk[p];
        if (!t) throw new Error('fin inesperado');
        if (t.t === 'n') { p++; return { k: 'n', v: t.v }; }
        if (t.t === 'a') {
          p++; var x = expr_(); var c = tk[p++];
          if (!c || c.t !== 'c' || (c.v === ')') !== (t.v === '(')) throw new Error('paréntesis');

          if (t.v === '(' && x.k === 'u' && x.x.k === 'n') return { k: 'n', v: x.s === '-' ? -x.x.v : x.x.v, lit: true };
          return { k: 'g', br: t.v, x: x };
        }
        throw new Error('símbolo inesperado');
      };
      var r = expr_();
      if (p !== tk.length) throw new Error('sobran símbolos');
      return r;
    }
    function valor(n) {
      var i, v;
      switch (n.k) {
        case 'n': return n.v;
        case 'u': return n.s === '-' ? -valor(n.x) : valor(n.x);

  /* ===================================================================
   *  EXPLICAR: redacta la explicación con los números y los pasos REALES
   *  de la pregunta (reduce el árbol por fases: paréntesis, potencias,
   *  signos, · y :, sumas y restas) y añade una regla concreta.
   * =================================================================== */
  var Explicar = (function () {
    var N = function (v) { return { k: 'n', v: v }; };

    }
    function contiene(n, k) { if (n.k === k) return true; var h = hijos(n); for (var i = 0; i < h.length; i++) if (contiene(h[i], k)) return true; return false; }
    function recorrer(n, f) { f(n); var h = hijos(n); for (var i = 0; i < h.length; i++) recorrer(h[i], f); }
    function transformar(n, f) {
      var r = f(n); if (r) return r;
      switch (n.k) {
        case 'u': return { k: 'u', s: n.s, x: transformar(n.x, f) };
        case 'g': return { k: 'g', br: n.br, x: transformar(n.x, f) };
        case 'p': return { k: 'p', b: transformar(n.b, f), e: transformar(n.e, f) };

    function render(n, ctx) {

          out = render(n.t[0], ctx);

    function expansion(b, e) {            // (−2)·(−2)·(−2)

    function acumulado(s, hasta) {        // valor de los primeros 'hasta' términos de una suma
      var v = valor(s.t[0]);

          if (o === '+' && it.k === 'n' && it.lit && it.v > 0) return 'Sumar (+' + it.v + ') es sumar ' + it.v + ': ' + fmt(a) + ' + (+' + it.v + ') = ' + fmt(a) + ' + ' + it.v + '.';

      }
      return null;
    }
    function reglaProd(t) {
      var ms = []; recorrer(t, function (x) { if (x.k === 'm') ms.push(x); });
      if (!ms.length) return null;
      var m = ms[0], a = valor(m.t[0]), b = valor(m.t[1]), op = m.o[0];
      var r = op === '*' ? a * b : a / b, ig = (a < 0) === (b < 0);
      var txt = render(m.t[0], 'first') + simb[op] + render(m.t[1], 'rest') + ': signos ' + (ig ? 'iguales, resultado positivo' : 'distintos, resultado negativo') + '; ' +
        Math.abs(a) + simb[op] + Math.abs(b) + ' = ' + Math.abs(r) + (r < 0 ? ', así que ' + fmt(r) : '') + '.';

    }

      if (!ps.length) return null;

      if (e === 1) return 'Elevado a 1, un número queda igual: ' + render(b, 'base') + '^1 = ' + fmt(bv) + '.';

  /* ===================================================================
   *  GENERADOR de preguntas (4 categorías x 10 niveles)
   *  Cada generador devuelve {p: texto plano con ^}. Después se VERIFICA con

    var CFG_SUMA = [null,

      { n: 2, lo: 2, hi: 15, sp: 1, gr: 0 },
      { n: 2, lo: 5, hi: 25, sp: 1, gr: 0, par0: 0.6 },
      { n: 3, lo: 2, hi: 12, sp: 0.6, gr: 0 },
      { n: 3, lo: 3, hi: 25, sp: 0.85, gr: 0, par0: 0.4 },
      { n: 4, lo: 2, hi: 20, sp: 0.8, gr: 0, par0: 0.3 },
      { n: 4, lo: 3, hi: 30, sp: 0.7, gr: 1 },
      { n: 5, lo: 3, hi: 30, sp: 0.7, gr: 1 },
      { n: 5, lo: 3, hi: 40, sp: 0.7, gr: 2 },

          Modal.ultimaDec = res;
        } else if (b.id === 'dec-copiar') copiar(tablaDecodificada(Modal.ultimaDec || [], '\t'), 'Tabla copiada: pégala en Excel.');
        else if (b.id === 'dec-csv') {
          var t2 = tablaDecodificada(Modal.ultimaDec || [], ';');
          try {
            var bl = new Blob(['﻿' + t2], { type: 'text/csv;charset=utf-8' }), a2 = document.createElement('a'); a2.href = URL.createObjectURL(bl); a2.download = 'mates-navidad-codigos.csv';
            document.body.appendChild(a2); a2.click(); document.body.removeChild(a2); setTimeout(function () { try { URL.revokeObjectURL(a2.href); } catch (er) { /* nada */ } }, 2000);

    },
    ayuda: function () {
      Modal.abrir('<h2>❓ Cómo se juega</h2><ol><li>Resuelve la operación <b>de cabeza</b>.</li><li>Escribe el resultado con el teclado (<b>−</b> pone el signo menos) y pulsa <b>Comprobar</b>.</li>' +
        '<li>Si fallas no pasa nada: te explicamos cómo se hace.</li></ol>' +
        '<p><b>Nivel:</b> lo difíciles que son tus preguntas, de 1 a 10. Sube si aciertas y baja si fallas.</p>' +
        '<p><b>Contrarreloj:</b> 5 minutos; cada error resta 10 segundos y «No sé» resta 3.<br><b>El rey de las mates:</b> 20 preguntas; gana quien sume más puntos.</p>' +
        '<p>Lo que más cuenta es <b>acertar</b>; ir rápido solo da un pequeño extra.</p>',
        [{ t: 'Entendido', cls: 'verde', fn: function () { Modal.cerrar(); } }], { cancel: function () { Modal.cerrar(); } });

  };

  var MODELO_HTML = '<div class="modelo"><h3>Qué es</h3><p>Cálculo mental con números enteros: suma y resta, multiplicación y división, potencias y operaciones combinadas. Cada alumno entra con su número de lista y el juego ajusta la dificultad (nivel 1 a 10) a cada categoría.</p>' +
    '<h3>Cómo recoger los resultados de la clase</h3><ol>' +
    '<li><b>Un iPad compartido:</b> en «Exportar y datos», «Descargar CSV» o «Copiar resumen (Excel)».</li>' +
    '<li><b>Un iPad por alumno, solo el código:</b> al terminar, el alumno pulsa «Enviar a mi profesor» (correo, AirDrop o Mensajes) o te enseña el código. Los pegas, uno por línea, en «Decodificar»: sale la tabla y el CSV, y se avisa de códigos mal copiados o repetidos.</li>' +
    '<li><b>Un iPad por alumno, con todo el detalle:</b> en cada iPad, «Exportar todas las partidas»; pega el texto en «Importar» de tu iPad. Se fusionan sin duplicados.</li></ol>' +
    '<h3>Puntuación</h3><p>Acertar suma 10 × nivel. Responder rápido añade como máximo un 10 % extra. Cada 3 aciertos seguidos suben el multiplicador (×1,1; tope ×1,3). Un error resta 5 × nivel. Gana quien más acierta, no quien más corre.</p>' +
    '<p><b>Contrarreloj:</b> 5:00 reales (el reloj solo se detiene mientras se lee la explicación de un error); error −10 s, «No sé» −3 s. Ranking por aciertos − 2 × errores. <b>El rey de las mates:</b> 20 preguntas, ranking por puntos. La pausa oculta la pregunta pero no detiene el tiempo. Las partidas abandonadas con «Salir» no se guardan.</p>' +
    '<h3>Clasificación y código</h3><p>Los empates comparten puesto. No entran las partidas sin aciertos o con 0 puntos. El código <code>L17-CR-23-2-480-261123-1542-K7M</code> es: lista 17, Contrarreloj, 23 aciertos, 2 errores, 480 puntos, 23/11/2026 15:42 y 3 caracteres de control (detectan erratas e invenciones sencillas; no es una firma).</p>' +
    '<h3>Datos y PIN</h3><p>Los datos se guardan solo en este dispositivo (navegador). Tras 3 PIN erróneos el panel se bloquea 30 s y el bloqueo se duplica en cada fallo siguiente. El PIN se configura en la constante <code>PIN_HASH</code> del archivo (instrucciones en el código).</p>' +
    '<details><summary>Modelo adaptativo (para el curioso)</summary>' +
    '<p>Para cada categoría se mantiene una distribución de probabilidad sobre la capacidad θ del alumno (rejilla de 0 a 12, paso 0,5). Tras cada respuesta se aplica la regla de Bayes: <code>posterior ∝ prior × verosimilitud<sup>peso</sup></code> con <code>P(acierto | θ, d) = 0,05 + 0,95 · σ((θ − d)/s)</code>, promediada sobre tres pendientes s = 1; 1,6; 2,4. Después hay una pequeña difusión y un olvido del 5 % hacia una gaussiana ancha, para notar al alumno que mejora.</p>' +
    '<p>Pesos: acierto rápido (menos del 60 % del tiempo objetivo) 1,0; normal 0,85; lento 0,6. Error 1,2; error muy rápido (posible adivinación) 0,7; «No sé» 0,7. Se busca el nivel con ≈ 68 % de probabilidad de acierto, con un 8 % de exploración, sin saltar más de ±1 nivel entre preguntas. Una categoría se abre cuando la anterior está dominada (nivel ≥ 3 con 4 respuestas, o ≥ 70 % de aciertos) o tras unas cuantas preguntas. Los errores vuelven 3 preguntas después con otra forma. Las explicaciones se generan con los números y pasos reales de cada pregunta.</p></details></div>';

  /* --- eventos y arranque --- */
  UI.cuentaLogo = 0; UI.tLogo = 0;
  UI.iniciar = function () {
    Almacen.cargar(); Sonido.mute = Almacen.getMute();
    UI.pintarSonido();
    $('escena-lista').innerHTML = arbolSVG().replace('id="estrella"', '') + '<span>🎁</span><span>🎅</span><span>🦌</span>';
    Teclado.crear($('tec-lista'), { signo: false, fila: '<button type="button" class="tecla entrar" data-k="ok">Entrar</button>' });
    Teclado.crear($('tec-juego'), { signo: true, fila: '<button type="button" class="tecla nose" data-k="nose">No sé</button><button type="button" class="tecla ok" data-k="ok" aria-label="Comprobar">✔ Comprobar</button>' });
    // estrella y luces del árbol de la escena de inicio encendidas
    var bs = document.querySelectorAll('#escena-lista .bola'); for (var i = 0; i < bs.length; i++) bs[i].classList.add('on');
    $('btn-cr').addEventListener('click', function () { Sonido.despertar(); iniciar('CR', alumnoActual); });
    $('btn-rm').addEventListener('click', function () { Sonido.despertar(); iniciar('RM', alumnoActual); });
    $('btn-rank').addEventListener('click', function () { UI.irRank('CR'); });
    $('btn-ayuda').addEventListener('click', Modal.ayuda);
    $('btn-cambiar').addEventListener('click', UI.irLista);
    $('btn-pausa').addEventListener('click', UI.pausar);
    $('btn-salir').addEventListener('click', UI.salir);
    $('rank-volver').addEventListener('click', function () { if (alumnoActual === null) UI.irLista(); else if (ultimoResultado && UI.volverRank === 'result') UI.mostrar('p-result'); else UI.irMenu(); });
    $('rank-tabs').addEventListener('click', function (e) { var b = e.target.closest('button[data-modo]'); if (b) { UI.modoRank = b.getAttribute('data-modo'); UI.pintarRank(); } });
    $('fbe-ok').addEventListener('click', function () { UI.bloquear(); avanzar(); });
    $('p-result').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return; Sonido.despertar();
      if (b.id === 'r-otra') iniciar(ultimoResultado ? ultimoResultado.rec.modo : J.modo, alumnoActual);
      else if (b.id === 'r-modo') UI.irMenu();
      else if (b.id === 'r-rank') UI.irRank(ultimoResultado.rec.modo, 'result');
      else if (b.id === 'r-alumno') UI.irLista();
      else if (b.id === 'r-enviar') UI.enviar();
    });
    $('btn-sonido').addEventListener('click', function () { Sonido.despertar(); Sonido.mute = !Sonido.mute; Almacen.setMute(Sonido.mute); UI.pintarSonido(); if (!Sonido.mute) Sonido.tecla(); });
    // 5 toques en el logo abren el panel de profesorado (NO durante una partida)
    $('logo').addEventListener('click', function () {
      if (UI.pant === 'juego') return;
      var t = Date.now(); if (t - UI.tLogo > 3000) UI.cuentaLogo = 0; UI.tLogo = t; UI.cuentaLogo++;
      if (UI.cuentaLogo >= 5) { UI.cuentaLogo = 0; if (!Modal.abierto) Modal.pedirPin(); }
    });
    // protección contra toques fantasma: justo tras cambiar de pantalla o cerrar un diálogo se ignoran los botones
    document.addEventListener('click', function (e) {
      if (ahoraMs() < UI.bloqueoHasta && e.target && e.target.closest && e.target.closest('button')) { e.stopPropagation(); e.preventDefault(); }
    }, true);
    // teclado físico
    document.addEventListener('keydown', function (e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      var k = e.key, tgt = e.target && e.target.tagName;
      if (Modal.abierto) {
        if (k === 'Tab') { Modal.atrapar(e); return; }
        if (k === 'Escape') { e.preventDefault(); Modal.escape(); return; }
        if (tgt === 'TEXTAREA' || tgt === 'INPUT') return;
        if (UI.ctx === 'pin') {
          var cp = null;
          if (/^[0-9]$/.test(k)) cp = k; else if (k === 'Backspace' || k === 'Delete') cp = 'del';
          else if (k === 'Enter' && (tgt !== 'BUTTON' || (e.target.classList && e.target.classList.contains('tecla')))) cp = 'ok';
          if (cp !== null) { e.preventDefault(); UI.pulsar(cp); }
          return;
        }
        if (k === 'Enter' && tgt !== 'BUTTON' && Modal.defecto) { var d = $(Modal.defecto); if (d) { d.click(); e.preventDefault(); } }
        return;
      }
      if (tgt === 'TEXTAREA' || tgt === 'INPUT') return;
      var code = null;
      if (/^[0-9]$/.test(k)) code = k;
      else if (k === '-' || k === '−') code = 'neg-';
      else if (k === '+') code = 'pos';
      else if (k === 'Backspace' || k === 'Delete') code = 'del';
      else if (k === 'Enter') {
        if (UI.ctx !== 'lista' && UI.ctx !== 'juego') return;       // en el resto de pantallas Enter activa el botón enfocado
        code = 'ok';
      }
      if (code === null) return;
      if ((code === 'neg-' || code === 'pos') && UI.ctx !== 'juego') return;
      if (UI.ctx === 'juego' && J && J.esperando && J.lectura && code === 'ok') { UI.bloquear(); avanzar(); e.preventDefault(); return; }
      e.preventDefault(); UI.pulsar(code);
    });
    document.addEventListener('pointerdown', function () { Sonido.despertar(); }, { once: true, capture: true });
    $('modal').addEventListener('click', function (e) { if (e.target === $('modal') && Modal.cancel && UI.ctx === 'pin') Modal.cancel(); });
    window.addEventListener('resize', function () { if (UI.pant === 'juego' && J && J.q) UI.ajustarExpr(); });
    UI.listo = true;
    UI.irLista();
    if (typeof setInterval !== 'undefined') UI.tIntervalo = setInterval(tick, 100);
    Nieve.iniciar();
  };
  UI.pintarSonido = function () {
    var b = $('btn-sonido'); b.textContent = Sonido.mute ? '🔇' : '🔊';
    b.setAttribute('aria-label', Sonido.mute ? 'Activar sonido' : 'Silenciar sonido'); b.setAttribute('aria-pressed', Sonido.mute ? 'true' : 'false');
  };

  /* --- nieve ligera en canvas (≤ 50 copos) --- */
  var Nieve = {
    iniciar: function () {
      var cv = $('nieve'), cx = cv.getContext && cv.getContext('2d'); if (!cx) return;
      var w = 0, h = 0, copos = [], N = 46, i;
      var reducido = G.matchMedia && G.matchMedia('(prefers-reduced-motion: reduce)').matches;
      function medir() { var dpr = Math.min(G.devicePixelRatio || 1, 2); w = G.innerWidth; h = G.innerHeight; cv.width = w * dpr; cv.height = h * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0); }
      medir(); G.addEventListener('resize', medir);
      for (i = 0; i < N; i++) copos.push({ x: Math.random() * w, y: Math.random() * h, r: 1.5 + Math.random() * 3, v: 0.3 + Math.random() * 0.9, d: Math.random() * 6.28 });
      function pintar() {
        cx.clearRect(0, 0, w, h); cx.fillStyle = 'rgba(255,255,255,.8)';
        for (var k = 0; k < copos.length; k++) { var c = copos[k]; cx.beginPath(); cx.arc(c.x, c.y, c.r, 0, 6.283); cx.fill(); }
      }
      function paso() {
        for (var k = 0; k < copos.length; k++) { var c = copos[k]; c.y += c.v; c.d += 0.01; c.x += Math.sin(c.d) * 0.4; if (c.y > h + 5) { c.y = -5; c.x = Math.random() * w; } }
        pintar(); if (!document.hidden) G.requestAnimationFrame(paso); else setTimeout(paso, 500);
      }
      if (reducido) pintar(); else G.requestAnimationFrame(paso);
    }
  };

  if (TEST) API.ui = UI;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', UI.iniciar); else UI.iniciar();
})();
